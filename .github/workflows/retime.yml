name: Re-time Scripts

# Diagnostic harness, run by hand — not a gate.
#
# Answers one question a single run cannot: is a script that misses its cap
# SLOW, or does it STALL? A slow script has a tight timing distribution; a
# stalling one is bimodal. See #271, and config/build/no_run.yaml, where the
# two have been assigned by which failure a run happened to show.
#
# A thin caller, exactly like smoke_tests.yml: the ceremony (dependency-chain
# checkout at the matching branch, install epilogue, cache dirs) stays in
# PyAutoHeart's reusable workflow, reached through its `runner` input. Copying
# that ceremony here is what the runner's own docstring warns against.
#
# It also carries the A/B arms for PyAutoFit#1530 (the XLA CPU Eigen-pool
# wedge), through `extra-args` rather than through new plumbing. Arms are an
# argument to the runner, not a step in the job, precisely so this file stays
# thin: dumps land in the job log inside ::group:: blocks instead of becoming
# an artifact upload step that would start reimplementing the ceremony above.

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: "Comma-separated script paths, relative to scripts/"
        required: true
        type: string
      repeats:
        description: "How many times to run each script"
        required: false
        type: string
        default: "5"
      script-timeout:
        description: "Per-script cap in seconds (300 = smoke, 1800 = release)"
        required: false
        type: string
        default: "300"
      extra-args:
        description: >-
          Extra retime.py arguments, word-split. The A/B mode lives here:
          `--arm NAME:KEY=VALUE[,KEY=VALUE]` (repeatable, runs dealt
          round-robin between arms within this one dispatch) and
          `--dump-after SECONDS` (read a still-running child's native stacks
          before the cap kills it). No value may contain a space — the
          reusable workflow runs `python "$RUNNER" $RUNNER_ARGS` unquoted.
        required: false
        type: string
        default: ""

jobs:
  retime:
    uses: PyAutoLabs/PyAutoHeart/.github/workflows/smoke-tests.yml@main
    with:
      chain: "PyAutoNerves PyAutoFit PyAutoArray PyAutoGalaxy PyAutoLens"
      runner: ".github/scripts/retime.py"
      runner-args: "--repeats ${{ inputs.repeats }} --scripts ${{ inputs.scripts }} ${{ inputs.extra-args }}"
      script-timeout: ${{ inputs.script-timeout }}
    secrets: inherit
