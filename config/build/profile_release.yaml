# Per-script environment variable configuration for the RELEASE-FIDELITY
# validation run (Heart's workspace-validation.yml, mode=release — the M3
# wheel-based release-fidelity path). Distinct from profile_smoke.yaml, which is the
# `smoke` profile used by the per-PR CI gate.
#
# The `release` profile runs REAL searches (PYAUTO_TEST_MODE="0" — each
# script's own n_like_max caps keep this bounded) at full resolution.
# Spec + acceptance table: PyAutoHeart/docs/release_validation.md.
#
# "defaults" are applied to every script on top of the inherited environment.
# Every var this profile cares about is given an EXPLICIT value in "defaults"
# (not left absent) — the runner only ever *sets* keys it's given, it never
# clears unrelated inherited env vars, so an absent key silently falls through
# to whatever the calling process already had (a leftover smoke-mode "1" from
# an earlier step, a developer's local shell, ...). Pinning everything here
# — including PYAUTO_SMALL_DATASETS="0" / PYAUTO_FAST_PLOTS="0" for full-res,
# real plots — makes the profile self-contained regardless of the caller's
# environment.
#
# The JAX set is DERIVED, not enumerated (PyAutoHands
# docs/env_profile_redesign.md §3): `derive_jax_markers: true` makes the
# resolver run any script whose path segment/stem matches `jax_*` / `*_jax` /
# `*_jit` with PYAUTO_DISABLE_JAX="0". Adding a JAX script to a `jax_*` folder
# (or naming it `*_jax` / `*_jit`) self-registers — there is no override list
# to keep in sync, and the validator errors on any PYAUTO_DISABLE_JAX override
# creeping back in (the hand-enumerated list was the silent-rot failure mode).

defaults:
  PYAUTO_TEST_MODE: "0"                     # real searches (each script caps its own n_like_max)
  PYAUTO_SMALL_DATASETS: "0"                # full-res grids/masks (release fidelity, not smoke)
  PYAUTO_DISABLE_JAX: "1"                   # force use_jax=False by default; the marker derivation re-enables JAX
  PYAUTO_FAST_PLOTS: "0"                    # real plots (release fidelity, not smoke)
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # TestPyPI dev version won't match the workspace pin
  JAX_ENABLE_X64: "True"                    # enable 64-bit precision in JAX
  # XLA CPU intra-op thread pool: disable multithreaded Eigen (PyAutoFit#1528).
  #
  # WORKAROUND, NOT A ROOT-CAUSE FIX. The heaviest multi_dataset/composite JAX
  # vmap graphs intermittently never finish MATERIALISING their result -- the
  # compile completes in ~12-18s, then jax.block_until_ready / jax.Array._value
  # never returns and the runner caps it. Five scripts were quarantined across
  # the two test workspaces over a month under the wrong name ("XLA compile
  # stall"); the stacks say execution, not compilation.
  #
  # Measured, ABAB, imaging/jax_likelihood/mge_group.py, 3 repeats x 2 Python
  # legs at the 300s cap:
  #   default          4/4 HANG   (run 33076408637)
  #   cache disabled   6/6 HANG   (run 33078033016) -- cache hypothesis refuted
  #   flag + 2 others  6/6 PASS   (run 33080638510, slowest 63.2s)
  #   this flag alone  6/6 PASS   (run 33082896277, slowest 62.3s)
  #   default again    4/6 HANG   (run 33085024710, verdict STALL, bimodal)
  # 12 passes / 0 hangs with the flag against 2 passes / 14 hangs without;
  # Fisher exact p ~ 3e-6. Costs ~15% on this script (62.3s vs 54.4s when it
  # completes at all), and affects only JAX/XLA scripts since nothing else
  # reads XLA_FLAGS.
  #
  # Remove it if the underlying XLA CPU deadlock is ever fixed upstream.
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # writable config dir for matplotlib

derive_jax_markers: true
