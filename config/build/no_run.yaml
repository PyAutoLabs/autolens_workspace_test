#
#   imaging/jax_likelihood/mge_group      NEEDS_FIX 2026-08-24, 16/16 lifetime cap hits
#   multi_dataset/jax_likelihood/delaunay.py  NEEDS_FIX 2026-08-01 (#245),
#     restored 2026-08-27 (PyAutoFit#1528), then RE-QUARANTINED 2026-08-28 (#287)
#     after a single 1805s hang at the release cap -- it is back in this file as
#     the NEEDS_FIX 2026-08-28 entry above.
#   multi_dataset/jax_likelihood/shared_preloads.py  RE-QUARANTINED 2026-08-28
#     after the same 1805s hang at the release cap in integrate run 33220882817,
#     one wave after delaunay.py -- it is back in this file as the second
#     NEEDS_FIX 2026-08-28 entry above. The other two stay restored.
#
# The name every marker used was wrong. It is NOT an XLA compile stall: the
# captured stacks put the process in jax.block_until_ready / jax.Array._value
# with compilation already finished in ~12-18s. It is an execution hang --
# materialising the vmap result never returns.
#
# The trigger is XLA CPU's multithreaded Eigen thread pool.
# profile_smoke.yaml and profile_release.yaml now set
# XLA_FLAGS=--xla_cpu_multi_thread_eigen=false. ABAB on mge_group, 3 repeats x
# 2 Python legs at the 300s cap: 12 passes / 0 hangs with the flag against
# 2 passes / 14 hangs without (Fisher exact p ~ 3e-6).
#
# Family re-time with the flag (run 33087267785), 3 repeats x 2 legs, 24/24
# completions, verdict NEITHER on every entry and every leg:
#   imaging/jax_likelihood/mge_group.py            61.2s / 61.3s
#   multi_dataset/jax_likelihood/delaunay.py       24.4s / 23.2s
#   multi_dataset/jax_likelihood/mge.py            16.0s / 14.5s
#   multi_dataset/jax_likelihood/shared_preloads.py 43.9s / 43.8s
#
# This is a WORKAROUND, not a root-cause fix: we know where it hangs and what
# avoids it, not why XLA's CPU thread pool wedges on these graphs. If the flag
# is ever removed, expect these four back.
