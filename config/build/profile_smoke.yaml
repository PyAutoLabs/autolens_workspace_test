# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#     including extension (so patterns may end in `.py` to anchor against
#     the script form, e.g. `imaging/visualization.py` matches only the
#     `.py` script, not `imaging/visualization_jax.py`).
#   - Patterns without '/' match the file stem exactly.

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_SMALL_DATASETS: "1"                # Cap grids/masks to 15x15, reduce MGE gaussians
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  PYAUTO_FAST_PLOTS: "1"                    # Skip tight_layout() + critical curve/caustic overlays
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # profile-owned so the base-env scrub (#161 step 3) cannot drop the mega-run's CI injection
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  # XLA CPU intra-op thread pool: disable multithreaded Eigen (PyAutoFit#1528).
  #
  # WORKAROUND, NOT A ROOT-CAUSE FIX. The heaviest multi_dataset/composite JAX
  # vmap graphs intermittently never finish MATERIALISING their result -- the
  # compile completes in ~12-18s, then jax.block_until_ready / jax.Array._value
  # never returns and the runner caps it. Five scripts were quarantined across
  # the two test workspaces over a month under the wrong name ("XLA compile
  # stall"); the stacks say execution, not compilation.
  #
  # Measured, ABAB, imaging/jax_likelihood/mge_group.py, 3 repeats x 2 Python
  # legs at the 300s cap:
  #   default          4/4 HANG   (run 33076408637)
  #   cache disabled   6/6 HANG   (run 33078033016) -- cache hypothesis refuted
  #   flag + 2 others  6/6 PASS   (run 33080638510, slowest 63.2s)
  #   this flag alone  6/6 PASS   (run 33082896277, slowest 62.3s)
  #   default again    4/6 HANG   (run 33085024710, verdict STALL, bimodal)
  # 12 passes / 0 hangs with the flag against 2 passes / 14 hangs without;
  # Fisher exact p ~ 3e-6. Costs ~15% on this script (62.3s vs 54.4s when it
  # completes at all), and affects only JAX/XLA scripts since nothing else
  # reads XLA_FLAGS.
  #
  # Remove it if the underlying XLA CPU deadlock is ever fixed upstream.
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

overrides:
  # NOT migrated to an in-file declaration: this override unsets
  # PYAUTO_DISABLE_JAX on database/scrape scripts that are NOT JAX-marked
  # (general.py, scaling_relation.py). A `# ENV:` declaration applies to the
  # release profile too, where PYAUTO_DISABLE_JAX defaults to "1" and the
  # marker derivation only re-enables JAX for marked scripts — so declaring
  # it here would flip these two scripts from numpy to JAX under release
  # (a real behavioural change, not the provable no-op the migration requires).
  # It therefore stays a smoke-only profile override (#187 Stage 2).
  # All other former overrides here were pure declarable-var unsets and have
  # migrated to in-file `# ENV:` declarations on their matched scripts.
  - pattern: "misc/database/scrape/"
    unset:
      - PYAUTO_TEST_MODE
      - PYAUTO_SMALL_DATASETS
      - PYAUTO_DISABLE_JAX
      - PYAUTO_FAST_PLOTS

  # Per-script timeout budget for the finite-difference gradient-certification
  # scripts (PyAutoHands#226). NOT a blanket cap raise: smoke's default stays
  # 300s (`defaults` above is silent on BUILD_SCRIPT_TIMEOUT, so every other
  # script keeps the built-in default from build_util.TIMEOUT_SECS).
  #
  # Why these need their own budget. Every jax_grad script declares
  # `ENV: jax full_datasets`, which unsets PYAUTO_SMALL_DATASETS and
  # PYAUTO_DISABLE_JAX. PYAUTO_TEST_MODE stays "2", but that only bypasses
  # AbstractSearch.fit and these scripts run NO search — they build a Fitness
  # and call jax.value_and_grad / finite differences directly. So smoke gives
  # them no reduction at all: they do exactly the full-resolution FD work the
  # release profile does, and mode=release already budgets this same class at
  # 1800s with a written rationale (PyAutoHeart workspace-validation.yml).
  # Smoke was left at 300s on the premise that smoke work is reduced; for this
  # class that premise is simply false.
  #
  # MEASURED basis — real CI durations from PyAutoHeart workspace-smoke run
  # 30938311069 (2026-08-04), the first run in which these scripts could finish:
  #   point_source/jax_grad/gradient.py   568.2s PASS   (63% of this budget)
  #   imaging/jax_grad/regularization.py  301.7s PASS   (34%)
  #   imaging/jax_grad/pixelization.py    259.8s PASS   (29%)
  #   imaging/jax_grad/knn.py             186.5s PASS   (21%)
  #   imaging/jax_grad/delaunay.py         89.6s PASS
  #   imaging/jax_grad/lp.py               41.6s PASS
  #   imaging/jax_grad/mge.py              41.2s PASS
  #
  # 900s covers the measured worst case with ~1.6x headroom. The largest swing
  # ever observed on these scripts is +23% (pixelization 06:31Z -> 22:25Z on
  # 2026-08-03), which on 568.2s is ~699s — still inside the budget. Chosen over
  # matching release's 1800s so the cap stays a runaway detector rather than a
  # 30-minute sink; it was 1800s only while the true durations were unknown.
  #
  # Do NOT re-derive these from local runs: local jax_grad runs fail assertions
  # that pass in CI, and scripts that abort early report truncated durations.
  # The provisional value came from a local measurement plus a CI/local ratio
  # taken from knn.py (~1.41x), which projected gradient.py at ~940s in CI. The
  # real figure is 568.2s — CI is FASTER than local for that script, so the
  # ratio did not transfer between scripts. Measure, do not extrapolate.
  #
  # These numbers also SETTLED the regression question this budget was accused
  # of hiding: pixelization.py came back at 259.8s against its 244.8s baseline
  # (+6%, ordinary variance), and knn.py (200.0 -> 186.5) and delaunay.py
  # (92.4 -> 89.6) both came back DOWN. A graph-size-dependent XLA regression
  # would not undo itself, so the 2026-08-03T22:25Z run was simply a slow run
  # and the cap was the whole problem. Nothing routes to the Profiling Agent.
  #
  # Pattern breadth: "jax_grad/" substring-matches 8 scripts — the 6 under
  # imaging/, point_source/gradient.py and interferometer/gradient.py (the last
  # is SLOW-skipped in no_run.yaml and will not run). scripts/weak/jax_grad.py
  # does NOT match: no trailing slash. See env_config._pattern_matches.
  #
  # Expressed with `set:` rather than a `timeout:` key on purpose —
  # validate_env_profiles.ALLOWED_OVERRIDE_KEYS is {pattern, set, unset}, so a
  # new key would be rejected. build_util.timeout_for reads this value
  # parent-side; before PyAutoHands#227 it reached only the child and was
  # silently ignored.
  - pattern: "jax_grad/"
    set:
      BUILD_SCRIPT_TIMEOUT: "900"

  # Smoke-sized run of the DelaunayNN fixed-shape cap audit (PyAutoBrain
  # /ci_speedup, 2026-09-08). The script samples 25 local perturbations + N
  # random mass models + one FIXED stress geometry, and its own docstring says
  # the reduction is safe: "Override DELAUNAY_NN_CAP_RANDOM_SAMPLES for a
  # shorter exploratory run. The fixed stress geometry is always included, so
  # the cap-16 regression remains covered even in a reduced run."
  #
  # Measured locally under this profile (libs from source, 4 cores):
  #   75 samples (default)  40.9s cold jax cache / 29.2s warm   (CI: 41.5s, cache miss)
  #   10 samples            ~24s cold (est.)      / 12.7s warm
  #    0 samples                                  / 10.5s warm
  # Every assertion held at 10 and at 0 (cap-16 overflow rows 94, cap-24 rows 4
  # — the same worst geometry, the fixed stress case, wins either way). The
  # remaining ~12s is six distinct XLA compiles (caps 64/16/24/32 × query
  # shapes) paid in full on a cache miss; only the JAX compile cache removes
  # that. The release profile is untouched: the full 75-sample audit still
  # runs there.
  - pattern: "misc/jax_assertions/delaunay_nn_caps.py"
    set:
      DELAUNAY_NN_CAP_RANDOM_SAMPLES: "10"

  # JAX persistent-cache threshold for the Delaunay JAX-likelihood script
  # (PyAutoBrain /ci_speedup, 2026-09-10). NOT a coverage change and NOT a
  # script change: no byte of delaunay.py moves. This only changes which XLA
  # executables CI is allowed to reuse from the cache it already restores.
  #
  # THE COST. `fit.log_likelihood` in the Path-A block is evaluated EAGERLY,
  # op by op. `jax.jit(analysis_jit.fit_from)` traces only the FitImaging
  # constructor -- measured, the jitted call itself is 0.018s -- and the
  # cached_property chain that actually computes the likelihood then runs
  # OUTSIDE the jit. cProfile of that single attribute access, cold cache:
  # 504 distinct executables, 471 of them compiled from scratch, 11.0s in
  # backend_compile_and_load. That is 50% of the whole 25.4s script.
  #
  # WHY THE CACHE DOES NOT HELP TODAY. Each of those 471 compiles takes
  # ~23ms, and JAX's default jax_persistent_cache_min_compile_time_secs is
  # 1.0s, so not one of them is ever written to JAX_COMPILATION_CACHE_DIR.
  # The board's `cache_jax: HIT` is a hit on a cache holding 3 entries
  # (616K) -- the two big compiles and nothing else. CI therefore re-pays the
  # eager compile in full on every run, hit or miss.
  #
  # MEASURED locally under this profile (libs from source, 4 cores, timing
  # runs serialised under a lock), warm cache in both regimes, n=4 each:
  #   threshold 1.0 (JAX default == CI today)  22.7 / 23.0 / 24.2 / 31.2s
  #                                            cache: 3 entries, 616K
  #   threshold 0   (this override)            10.1 / 10.3 / 10.6 / 10.6s
  #                                            cache: 513 entries, 2.9M
  # First-ever run against an empty cache is unchanged (26.3s vs 28.0s):
  # writing the extra entries costs nothing measurable. CI reports 32.8s on
  # py3.13, which matches the threshold-1.0 regime, not the threshold-0 one.
  #
  # WHY THE ASSERTIONS SURVIVE. Nothing about the computation changes -- the
  # persistent cache is a memo of XLA compilation keyed on the lowered HLO,
  # so a cache hit returns the same executable the compiler would have built.
  # Printed output was diffed byte-for-byte across the two regimes and is
  # identical, including [-541.50627819 x3], NumPy -44.32005541739227, JIT
  # -44.32005541740216 and all four PASS lines; RC=0 both ways. The release
  # profile is untouched -- this file is smoke-only.
  #
  # SCOPED TO ONE SCRIPT because profile_smoke.yaml is shared. The same
  # measurement argues for putting this in `defaults:` (every jax_likelihood
  # and jax_grad script pays the same eager-compile tax), or better still in
  # PyAutoHeart's reusable smoke-tests.yml beside the cache_jax step that
  # owns JAX_COMPILATION_CACHE_DIR. That is a wider decision -- it grows the
  # cached artefact by roughly 500 entries per script -- so it is left to a
  # human rather than taken here.
  - pattern: "imaging/jax_likelihood/delaunay.py"
    set:
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"

  # Make the restored JAX compile cache actually serve the DelaunayNN
  # correctness gate (PyAutoBrain /ci_speedup, 2026-09-10).
  #
  # NOTHING IS REDUCED. This is not a smoke-sizing override like the
  # delaunay_nn_caps.py entry above it: the script runs exactly the work
  # it ran before, on exactly the same shapes, and every printed value is
  # byte-identical. The only change is that the compiled executables are
  # persisted and reloaded instead of re-derived on every run.
  #
  # THE COST. Compile census (JAX_LOG_COMPILES=1, cold cache, jax 0.11.1):
  #   312 distinct XLA compiles, 20.72s of the script's 32.9s total
  #     308 of them take UNDER ONE SECOND each   15.00s
  #       4 of them take over a second            5.72s
  # `jax_persistent_cache_min_compile_time_secs` defaults to 1.0, so JAX
  # refuses to WRITE those 308 entries to the persistent cache. PyAutoHeart's
  # smoke-tests.yml restores and saves `${workspace}/.pyauto_jax_cache` and
  # exports JAX_COMPILATION_CACHE_DIR into every script subprocess, but sets no
  # threshold — so the cache can only ever hold 4 of this script's 312 entries
  # and the other 15.0s is recompiled every single run. That is why the Heart
  # board reports `cache_jax: HIT` next to a number that matches a cold run.
  #
  # MEASURED locally under this profile (libs from source, 4 cores, jax 0.11.1,
  # byte-identical copies of the script so each threshold gets its own cache):
  #   warm cache, threshold 1.0 (JAX default = CI today)   29.0s / 25.2s
  #   warm cache, threshold 0   (this override)            13.5s / 13.6s
  #   cold cache, empty dir, either way                    32.9s / 33.0s
  # The "before" bracket reproduces CI closely: the board has this script at
  # 31.8s on py3.13 and 25.4s on py3.12, both with cache_jax: HIT. Cold is
  # unchanged — the first run after a PYAUTO_CACHE_EPOCH bump still pays every
  # compile; the win is on every run after it.
  #
  # ASSERTIONS. All of them, re-verified against the unmodified run and
  # byte-identical: source reconstruction parity relative_l2=9.884215e-05
  # correlation=0.998595442; shape 1200 mesh points x 15000 queries; single-pass
  # parity 6/6 on both halves (15000 queries, 4800 split points);
  # split-regularization compaction parity max|jax-numpy|=3.553e-15 with 1 row
  # wider than compact width 12 and budget 0 -> NaN; chunk invariance 6/6 across
  # (64, 256, 1024); flip values/gradients identical to the last digit; and the
  # cap-headroom diagnostics max_cavity=11 max_neighbors=13 against the caps of
  # 32. RC=0 under smoke and under PROFILE=release (13.6s).
  #
  # THE SIX SIBSON_* KNOBS THE SCRIPT READS WERE MEASURED AND REJECTED:
  #   SIBSON_POINTS / SIBSON_QUERIES — measured, not worth it. 1200x15000 ->
  #     300x3000 buys 1.5s (32.9 -> 31.5s cold, 4%), because the cost is compile
  #     of the Sibson graph, not the arrays: the three biggest sections run on
  #     the FIXED 9-point mesh and the FIXED 4-point flip geometry. And it is
  #     not free — it drops max_cavity 11 -> 8 and max_neighbors 13 -> 10,
  #     weakening the headroom that `assert not overflow.any()` demonstrates,
  #     against the script's own __Env__ note that these arrays are
  #     production-sized on purpose.
  #   SIBSON_CAVITY / SIBSON_NEIGHBORS — forbidden. Both are caps an assertion
  #     compares against: `assert not overflow.any()` ("Sibson cavity cap
  #     overflowed"), `full_tables[6].shape == (4*N, MAX_NEIGHBORS)`, and
  #     `SPLIT_TABLE_WIDTH > SPLIT_REG_COMPACT_WIDTH + 8` (= 20), which the
  #     forced-wide-row supplement path needs. Lowering either changes what is
  #     checked.
  #   SIBSON_REPEATS — already 1; 0 would take np.median of an empty list.
  #   SIBSON_CHUNK — measured, rejected: 1024 is SLOWER (34.1s vs 32.9s cold),
  #     and 256 is already reused as one of the three chunk-invariance legs, so
  #     any other value adds a fourth compile.
  #
  # PRICE. This script's share of the shared CI cache grows from 7 entries /
  # 1.1 MB to 299 / 3.0 MB. No cold-run penalty was measurable (33.5s writing 7
  # entries vs 33.0s writing 299).
  #
  # WHY THE delaunay_nn_caps.py ENTRY DOES NOT NEED THIS, though it sits in the
  # same file and audits the same kernel. Censused at its shipped 10-sample
  # setting: 6 compiles, 4.29s, and FOUR of the six take 1.048-1.094s, i.e. they
  # clear the 1.0s threshold and are cached in CI as its block claims. Measured
  # warm: 17.0s at threshold 1.0 against 15.1s at threshold 0 - a 1.9s spread,
  # so that script is genuinely threshold-insensitive. Two caveats worth
  # recording: those four compiles clear 1.0s by under 10%, so a faster runner
  # would drop them under it and silently stop caching them; and that block's
  # quoted warm figure was taken with a harness that hardcodes threshold 0, so
  # it is a threshold-0 number, not the CI regime. The two scripts are opposite
  # shapes - caps.py compiles one lambda a few times at different static caps,
  # this script runs a long chain of eager jnp ops and many small jits - which
  # is exactly why the threshold is worth ~1.9s there and ~11.6-15.4s here.
  #
  # BETTER HOME. Every JAX smoke script whose compiles are small pays this same
  # tax and none of them sets the threshold either, so the general fix is one
  # line in PyAutoHeart's smoke-tests.yml job env beside
  # JAX_COMPILATION_CACHE_DIR. This per-script override is the in-lane change;
  # it does not preclude the workflow one.
  # (JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES already defaults to 0 and is not
  # needed.)
  - pattern: "misc/jax_assertions/delaunay_nn.py"
    set:
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
