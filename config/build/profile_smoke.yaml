# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#     including extension (so patterns may end in `.py` to anchor against
#     the script form, e.g. `imaging/visualization.py` matches only the
#     `.py` script, not `imaging/visualization_jax.py`).
#   - Patterns without '/' match the file stem exactly.

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_SMALL_DATASETS: "1"                # Cap grids/masks to 15x15, reduce MGE gaussians
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  PYAUTO_FAST_PLOTS: "1"                    # Skip tight_layout() + critical curve/caustic overlays
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"  # profile-owned so the base-env scrub (#161 step 3) cannot drop the mega-run's CI injection
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  # XLA_FLAGS is EXPLICITLY empty: the runner only sets keys and never clears
  # inherited ones, so an absent key would let a caller's XLA_FLAGS leak in.
  # autonerves still appends its own defaults (constant folding, GPU autotune).
  #
  # The --xla_cpu_multi_thread_eigen=false workaround that lived here
  # (PyAutoFit#1528: 12 passes / 0 hangs with it vs 2 / 14 without on jax
  # 0.10-0.11) was REMOVED for the jax>=0.12 floor (PyAutoNerves#213/#215,
  # PyAutoHeart#335): on jax 0.12.0 / 0.12.0.1 no reproducer hangs without it
  # (0 in 30,000 calls, RAL 415009), and it slowed pixelized likelihoods by
  # 18-50 % per call. History: git log -S "multi_thread_eigen" on this file.
  XLA_FLAGS: ""
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

overrides:
  # NOT migrated to an in-file declaration: this override unsets
  # PYAUTO_DISABLE_JAX on database/scrape scripts that are NOT JAX-marked
  # (general.py, scaling_relation.py). A `# ENV:` declaration applies to the
  # release profile too, where PYAUTO_DISABLE_JAX defaults to "1" and the
  # marker derivation only re-enables JAX for marked scripts — so declaring
  # it here would flip these two scripts from numpy to JAX under release
  # (a real behavioural change, not the provable no-op the migration requires).
  # It therefore stays a smoke-only profile override (#187 Stage 2).
  # All other former overrides here were pure declarable-var unsets and have
  # migrated to in-file `# ENV:` declarations on their matched scripts.
  - pattern: "misc/database/scrape/"
    unset:
      - PYAUTO_TEST_MODE
      - PYAUTO_SMALL_DATASETS
      - PYAUTO_DISABLE_JAX
      - PYAUTO_FAST_PLOTS

  # Per-script timeout budget for the finite-difference gradient-certification
  # scripts (PyAutoHands#226). NOT a blanket cap raise: smoke's default stays
  # 300s (`defaults` above is silent on BUILD_SCRIPT_TIMEOUT, so every other
  # script keeps the built-in default from build_util.TIMEOUT_SECS).
  #
  # Why these need their own budget. Every jax_grad script declares
  # `ENV: jax full_datasets`, which unsets PYAUTO_SMALL_DATASETS and
  # PYAUTO_DISABLE_JAX. PYAUTO_TEST_MODE stays "2", but that only bypasses
  # AbstractSearch.fit and these scripts run NO search — they build a Fitness
  # and call jax.value_and_grad / finite differences directly. So smoke gives
  # them no reduction at all: they do exactly the full-resolution FD work the
  # release profile does, and mode=release already budgets this same class at
  # 1800s with a written rationale (PyAutoHeart workspace-validation.yml).
  # Smoke was left at 300s on the premise that smoke work is reduced; for this
  # class that premise is simply false.
  #
  # MEASURED basis — real CI durations from PyAutoHeart workspace-smoke run
  # 30938311069 (2026-08-04), the first run in which these scripts could finish:
  #   point_source/jax_grad/gradient.py   568.2s PASS   (63% of this budget)
  #   imaging/jax_grad/regularization.py  301.7s PASS   (34%)
  #   imaging/jax_grad/pixelization.py    259.8s PASS   (29%)
  #   imaging/jax_grad/knn.py             186.5s PASS   (21%)
  #   imaging/jax_grad/delaunay.py         89.6s PASS
  #   imaging/jax_grad/lp.py               41.6s PASS
  #   imaging/jax_grad/mge.py              41.2s PASS
  #
  # 900s covers the measured worst case with ~1.6x headroom. The largest swing
  # ever observed on these scripts is +23% (pixelization 06:31Z -> 22:25Z on
  # 2026-08-03), which on 568.2s is ~699s — still inside the budget. Chosen over
  # matching release's 1800s so the cap stays a runaway detector rather than a
  # 30-minute sink; it was 1800s only while the true durations were unknown.
  #
  # Do NOT re-derive these from local runs: local jax_grad runs fail assertions
  # that pass in CI, and scripts that abort early report truncated durations.
  # The provisional value came from a local measurement plus a CI/local ratio
  # taken from knn.py (~1.41x), which projected gradient.py at ~940s in CI. The
  # real figure is 568.2s — CI is FASTER than local for that script, so the
  # ratio did not transfer between scripts. Measure, do not extrapolate.
  #
  # These numbers also SETTLED the regression question this budget was accused
  # of hiding: pixelization.py came back at 259.8s against its 244.8s baseline
  # (+6%, ordinary variance), and knn.py (200.0 -> 186.5) and delaunay.py
  # (92.4 -> 89.6) both came back DOWN. A graph-size-dependent XLA regression
  # would not undo itself, so the 2026-08-03T22:25Z run was simply a slow run
  # and the cap was the whole problem. Nothing routes to the Profiling Agent.
  #
  # Pattern breadth: "jax_grad/" substring-matches 8 scripts — the 6 under
  # imaging/, point_source/gradient.py and interferometer/gradient.py (the last
  # is SLOW-skipped in no_run.yaml and will not run). scripts/weak/jax_grad.py
  # does NOT match: no trailing slash. See env_config._pattern_matches.
  #
  # Expressed with `set:` rather than a `timeout:` key on purpose —
  # validate_env_profiles.ALLOWED_OVERRIDE_KEYS is {pattern, set, unset}, so a
  # new key would be rejected. build_util.timeout_for reads this value
  # parent-side; before PyAutoHands#227 it reached only the child and was
  # silently ignored.
  - pattern: "jax_grad/"
    set:
      BUILD_SCRIPT_TIMEOUT: "900"

  # Smoke-sized run of the DelaunayNN fixed-shape cap audit (PyAutoBrain
  # /ci_speedup, 2026-09-08). The script samples 25 local perturbations + N
  # random mass models + one FIXED stress geometry, and its own docstring says
  # the reduction is safe: "Override DELAUNAY_NN_CAP_RANDOM_SAMPLES for a
  # shorter exploratory run. The fixed stress geometry is always included, so
  # the cap-16 regression remains covered even in a reduced run."
  #
  # Measured locally under this profile (libs from source, 4 cores):
  #   75 samples (default)  40.9s cold jax cache / 29.2s warm   (CI: 41.5s, cache miss)
  #   10 samples            ~24s cold (est.)      / 12.7s warm
  #    0 samples                                  / 10.5s warm
  # Every assertion held at 10 and at 0 (cap-16 overflow rows 94, cap-24 rows 4
  # — the same worst geometry, the fixed stress case, wins either way). The
  # remaining ~12s is six distinct XLA compiles (caps 64/16/24/32 × query
  # shapes) paid in full on a cache miss; only the JAX compile cache removes
  # that. The release profile is untouched: the full 75-sample audit still
  # runs there.
  - pattern: "misc/jax_assertions/delaunay_nn_caps.py"
    set:
      DELAUNAY_NN_CAP_RANDOM_SAMPLES: "10"
